<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Fitri Rachmania - Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.55" stop-color="#210B13"/>
      <stop offset="1" stop-color="#641B25"/>
    </linearGradient>

    <!-- shimmer yang menyapu huruf -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#C9485B"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9485B"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9485B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C9485B" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#E8A2B0" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1000" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="22" fill="url(#dots)"/>

  <!-- aura berdenyut di belakang nama -->
  <ellipse cx="500" cy="150" rx="380" ry="120" fill="url(#aura)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- corner brackets -->
  <g fill="none" stroke="#C9485B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M28 62 V28 H62"/>
    <path d="M938 28 H972 V62"/>
    <path d="M28 258 V292 H62"/>
    <path d="M938 292 H972 V258"/>
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- label kecil -->
  <g font-family="'Courier New',Consolas,monospace" font-size="13" letter-spacing="3">
    <text x="80" y="48" fill="#C9485B">&lt;FDEVHUB /&gt;
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;1" dur="1.5s" fill="freeze"/>
    </text>
    <text x="920" y="48" fill="#9A6A75" text-anchor="end">PORTFOLIO · 2026
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;1" dur="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- partikel melayang -->
  <g fill="#E8A2B0">
    <circle cx="120" cy="330" r="2.2"><animate attributeName="cy" from="330" to="-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="330" r="1.6"><animate attributeName="cy" from="330" to="-10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="330" r="2.6"><animate attributeName="cy" from="330" to="-10" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="330" r="1.4"><animate attributeName="cy" from="330" to="-10" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="330" r="2"><animate attributeName="cy" from="330" to="-10" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="330" r="2.8"><animate attributeName="cy" from="330" to="-10" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="330" r="1.7"><animate attributeName="cy" from="330" to="-10" dur="8.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="330" r="2.3"><animate attributeName="cy" from="330" to="-10" dur="7s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="4s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">

    <!-- glow di belakang FITRI -->
    <text x="507" y="172" font-size="124" font-weight="900" letter-spacing="14" fill="#C9485B" filter="url(#glow)" opacity="0">FITRI
      <animate attributeName="opacity" values="0;0;0.55;0.25;0.55" keyTimes="0;0.25;0.45;0.75;1" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- outline yang "digambar" -->
    <text x="507" y="172" font-size="124" font-weight="900" letter-spacing="14" fill="none" stroke="#E8A2B0" stroke-width="1.6" stroke-dasharray="1400" stroke-dashoffset="1400">FITRI
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="3.4s" fill="freeze"/>
    </text>

    <!-- teks utama dengan shimmer -->
    <text x="507" y="172" font-size="124" font-weight="900" letter-spacing="14" fill="url(#shine)" opacity="0">FITRI
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="1s" fill="freeze"/>
    </text>

    <!-- RACHMANIA -->
    <text x="512" y="222" font-size="34" font-weight="300" letter-spacing="26" fill="#E8A2B0" opacity="0">RACHMANIA
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.2s" dur="1s" fill="freeze"/>
    </text>
  </g>

  <!-- garis pemisah yang memanjang -->
  <line x1="500" y1="245" x2="500" y2="245" stroke="#C9485B" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" from="500" to="330" begin="2s" dur="1s" fill="freeze"/>
    <animate attributeName="x2" from="500" to="670" begin="2s" dur="1s" fill="freeze"/>
  </line>
  <circle cx="500" cy="245" r="4" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.4s" fill="freeze"/>
    <animate attributeName="r" values="4;6;4" dur="2s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- subtitle -->
  <text x="504" y="283" font-family="'Courier New',Consolas,monospace" font-size="15" letter-spacing="6" fill="#B98A95" text-anchor="middle" opacity="0">FRONTEND DEVELOPER  ·  UI/UX  ·  SOFTWARE ENGINEERING
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="1s" fill="freeze"/>
  </text>
</svg>
