<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="About Fitri Rachmania" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9485B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9485B"/>
      <stop offset="1" stop-color="#C9485B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#1A0A10"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="328" rx="18" fill="url(#bg)" stroke="#641B25" stroke-width="1.5"/>
  <rect x="1" y="1" width="6" height="328" rx="3" fill="#C9485B"/>
  <rect x="580" y="30" width="1.5" height="270" fill="url(#line)"/>

  <!-- ================= KIRI ================= -->
  <g font-family="'Courier New',Consolas,monospace" font-size="12" letter-spacing="3" fill="#C9485B">
    <text x="40" y="40">// ABOUT ME</text>
    <text x="40" y="214">// FOCUS</text>
  </g>

  <text x="40" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Hello, I'm Fitri.</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#D6D6D6">
    <text x="40" y="118">Software Engineering student at <tspan font-weight="700" fill="#FFFFFF">SMKN 8 Malang</tspan></text>
    <text x="40" y="142">yang suka mengubah ide jadi pengalaman digital</text>
    <text x="40" y="166">lewat <tspan font-weight="700" fill="#FFFFFF">clean code</tspan>, <tspan font-weight="700" fill="#FFFFFF">desain yang thoughtful</tspan>,</text>
    <text x="40" y="190">dan <tspan font-weight="700" fill="#FFFFFF">layout responsif</tspan>.</text>
  </g>

  <g font-family="'Courier New',Consolas,monospace" font-size="15" fill="#FFFFFF">
    <text x="40" y="244"><tspan fill="#C9485B">▸</tspan>  Frontend Web Development</text>
    <text x="40" y="266"><tspan fill="#C9485B">▸</tspan>  UI/UX &amp; Interface Design</text>
    <text x="40" y="288"><tspan fill="#C9485B">▸</tspan>  Responsive Web Experiences</text>
    <text x="40" y="310"><tspan fill="#C9485B">▸</tspan>  Web Application Development</text>
  </g>

  <!-- ================= KANAN ================= -->
  <text x="620" y="40" font-family="'Courier New',Consolas,monospace" font-size="12" letter-spacing="3" fill="#C9485B">// QUICK PROFILE</text>

  <g stroke="#2A1A1F" stroke-width="1">
    <line x1="620" y1="96" x2="960" y2="96"/>
    <line x1="620" y1="134" x2="960" y2="134"/>
    <line x1="620" y1="172" x2="960" y2="172"/>
    <line x1="620" y1="210" x2="960" y2="210"/>
    <line x1="620" y1="248" x2="960" y2="248"/>
  </g>

  <g font-family="'Courier New',Consolas,monospace" letter-spacing="2">
    <g opacity="0">
      <text x="620" y="82" font-size="12" fill="#C9485B">NAME</text>
      <text x="740" y="82" font-size="15" fill="#FFFFFF" letter-spacing="0">Fitri Rachmania</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="620" y="120" font-size="12" fill="#C9485B">USERNAME</text>
      <text x="740" y="120" font-size="15" fill="#FFFFFF" letter-spacing="0">fedevhub</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="620" y="158" font-size="12" fill="#C9485B">EDUCATION</text>
      <text x="740" y="158" font-size="15" fill="#FFFFFF" letter-spacing="0">SMKN 8 Malang</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="620" y="196" font-size="12" fill="#C9485B">FIELD</text>
      <text x="740" y="196" font-size="15" fill="#FFFFFF" letter-spacing="0">Software Engineering</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="620" y="234" font-size="12" fill="#C9485B">ROLE</text>
      <text x="740" y="234" font-size="15" fill="#FFFFFF" letter-spacing="0">Frontend Developer</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="620" y="272" font-size="12" fill="#C9485B">STATUS</text>
      <text x="740" y="272" font-size="15" fill="#FFFFFF" letter-spacing="0">Always Learning</text>
      <rect x="878" y="259" width="9" height="16" fill="#C9485B">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.6s" fill="freeze"/>
    </g>
  </g>
</svg>
